<app-page-header title="Change password" />

<div class="card stack stack--loose password-card">
  @if (forced) {
    <app-alert tone="info" title="Choose your own password">
      An administrator set a temporary password for you. Choose a new one to continue.
    </app-alert>
  }

  <app-api-error-alert [error]="error()" [extra]="extraMessages()" />

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" #formElement>
    <app-form-field
      [label]="forced ? 'Temporary password' : 'Current password'"
      [control]="form.controls.currentPassword"
      requiredMessage="Enter the password you use now."
    >
      <input
        appControl
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </app-form-field>

    <div class="stack stack--tight">
      <app-form-field
        label="New password"
        [control]="form.controls.newPassword"
        requiredMessage="Choose a new password."
      >
        <input
          appControl
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
      </app-form-field>
      <app-password-hints [password]="typed().newPassword ?? ''" [username]="session.username()" />
    </div>

    <app-form-field
      label="Type the new password again"
      [control]="form.controls.confirmPassword"
      requiredMessage="Type the new password again."
    >
      <input
        appControl
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </app-form-field>

    <div class="form__actions form__actions--sticky">
      <button appButton variant="primary" type="submit" [busy]="saving()">Change password</button>
    </div>
  </form>
</div>
