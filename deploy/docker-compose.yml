# Local development and single-host deployment.
#   docker compose -f deploy/docker-compose.yml up -d sql          # only the database, for development
#   docker compose -f deploy/docker-compose.yml up -d --build      # database, API and web
# Values come from a .env file next to the compose command (copy .env.example). Nothing secret is committed.
# First installation, in order (docs/operations/deployment.md): up -d sql db-init, apply the migration script as the administrator,
# then up -d --build. The API connects as the least-privilege cms_app login that db-init creates, never as the administrator.
name: cms

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"   # loopback only; the database is never published to the network
    volumes:
      - sql-data:/var/opt/mssql
      - ../backups:/var/opt/mssql/backup
    healthcheck:
      # The password goes in through the environment, not -P, so it never shows in the process list.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates the database and the cms_app login (read and write, no schema changes). Safe to run again; running it again with
  # a new CMS_APP_DB_PASSWORD rotates the password.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sql:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${CMS_DB_PASSWORD}
      CMS_APP_DB_PASSWORD: ${CMS_APP_DB_PASSWORD:?Set CMS_APP_DB_PASSWORD in .env}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-I", "-C", "-b", "-S", "sql", "-U", "sa", "-i", "/sql/create-app-login.sql"]

  api:
    build:
      context: ..
      dockerfile: src/Cms.Api/Dockerfile
      args:
        CMS_RELEASE_SHA: ${CMS_RELEASE_SHA:-local}
    image: cms-api:${CMS_RELEASE_SHA:-local}
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CMS_DATABASE_CONNECTION: Server=sql,1433;Database=Cms;User Id=cms_app;Password=${CMS_APP_DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      # Session keys survive a restart in this volume, so a new release doesn't sign everyone out.
      DataProtection__KeysPath: /var/lib/cms/keys
      CMS_RELEASE_SHA: ${CMS_RELEASE_SHA:-local}
      Bootstrap__Enabled: ${CMS_BOOTSTRAP_ENABLED:-false}
      Database__MigrateOnStartup: "false"
    volumes:
      - api-keys:/var/lib/cms/keys
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        CMS_RELEASE_SHA: ${CMS_RELEASE_SHA:-local}
    image: cms-web:${CMS_RELEASE_SHA:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  sql-data:
  api-keys:
