# Serves the Angular app and forwards /api and /health to the API container. TLS is terminated in front of this container
# (the reverse proxy or load balancer must send X-Forwarded-Proto so the API issues Secure cookies).

# The address of the person is what the sign-in rate limiter and the activity log care about. Behind a proxy, nginx sees the proxy's
# address, so it is taken from X-Forwarded-For, but only when the request really came from a private network (the proxy or load
# balancer). Anything else could be a person typing their own X-Forwarded-For. If the proxy in front of this container has a public
# address, add it with another set_real_ip_from line.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # One address, set here and never appended to a client-supplied list: the API trusts exactly this value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # The API sends its own copies of the security headers.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
    include /etc/nginx/snippets/security-headers.conf;

    # Adding a document or a new version is the one request that carries a file. The limit is the API's own (FileStorage:MaxFileMegabytes,
    # 25 by default, plus 1 MB of form overhead): keep it at least that large, or nginx answers a big file with its own error page instead
    # of the API's plain-words one. The file is streamed to the API as it arrives rather than written to nginx's disk first, and a phone
    # on a slow connection gets longer to finish sending. Everything else under /api/ keeps the 2 MB limit above.
    location ~ "^/api/(?:projects/[0-9a-fA-F-]{36}/documents|documents/[0-9a-fA-F-]{36}/versions)$" {
      proxy_pass http://api:8080;
      client_max_body_size 26m;
      proxy_request_buffering off;
      client_body_timeout 120s;
      proxy_read_timeout 120s;
    }
  }

  # "Is it running" is public; readiness (database state) and the version are for people and monitors inside the private network.
  location = /health/live {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location /health/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Hashed build output never changes under the same name.
  location ~* \.(?:js|css|woff2|svg|png|ico|webp)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell and version marker must always be fresh so a new release is picked up.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /version.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
