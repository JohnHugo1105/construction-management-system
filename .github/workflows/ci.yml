name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build, tests (real SQL Server), architecture rules, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start SQL Server 2022 for the integration tests
        run: |
          # A throwaway password for a throwaway container; generated here, masked in logs, never stored.
          PASSWORD="Ci-$(openssl rand -hex 12)-Aa1!"
          echo "::add-mask::$PASSWORD"
          docker run -d --name constructopx-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "CONSTRUCTOPX_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if docker exec -e SQLCMDPASSWORD="$PASSWORD" constructopx-sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q "SELECT 1" -b >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          docker logs constructopx-sql | tail -30
          exit 1

      - name: Restore (locked)
        run: dotnet restore ConstructOPX.sln --locked-mode
      - name: Build
        run: dotnet build ConstructOPX.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ConstructOPX.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Verify the EF Core model has no changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ConstructOPX.Infrastructure --startup-project src/ConstructOPX.Api --no-build --configuration Release
      - name: Produce the idempotent migration script
        run: dotnet ef migrations script --idempotent --project src/ConstructOPX.Infrastructure --startup-project src/ConstructOPX.Api --no-build --configuration Release -o artifacts/migrate.sql
      - uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: artifacts/migrate.sql

  web:
    name: Angular build, unit tests, source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: node scripts/check-no-gradients.mjs
      - run: node scripts/check-server-backed-interactions.mjs
      - run: npm test --prefix web -- --watch=false
      - run: npm run build --prefix web

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (tagged with the commit)
        run: docker build -f src/ConstructOPX.Api/Dockerfile --build-arg CONSTRUCTOPX_RELEASE_SHA=${{ github.sha }} -t constructopx-api:${{ github.sha }} .
      - name: Build web image (tagged with the commit)
        run: docker build -f deploy/web/Dockerfile --build-arg CONSTRUCTOPX_RELEASE_SHA=${{ github.sha }} -t constructopx-web:${{ github.sha }} .
